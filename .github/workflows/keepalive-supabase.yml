# Keep-alive project Supabase free tier: project di-pause setelah ~7 hari
# tanpa aktivitas API. Workflow ini mengirim 1-2 request ringan setiap 3 hari
# supaya project tetap aktif. Bisa dijalankan manual lewat tab Actions
# (workflow_dispatch).
name: Keep Supabase aktif

on:
  schedule:
    # Tiap 3 hari, 08.00 UTC (cukup aman dari batas pause 7 hari).
    - cron: "0 8 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ping project Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/keepalive-supabase.mjs
